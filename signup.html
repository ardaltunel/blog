<!DOCTYPE html>
<html lang="tr">
<head>
    <title>Kayıt Ol | Arda Altunel</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://bdadbqlkmdwzzkrwetrf.supabase.co; font-src 'self'; connect-src 'self' https://bdadbqlkmdwzzkrwetrf.supabase.co; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <script src="./assets/js/theme-bootstrap.js?v=9"></script>
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" href="./assets/favicon/favicon.ico">
    <link rel="stylesheet" href="./assets/vendor/montserrat/montserrat.css">
    <link rel="stylesheet" href="./assets/css/style.css?v=38">
</head>
<body>
<nav>
    <div class="container nav__container">
        <a href="./" class="nav__logo">ARDALTUNEL</a>
        <ul class="nav__items"></ul>
        <button class="theme__toggle" type="button" aria-label="Temayı değiştir"><img class="ui-icon theme__icon theme__icon--sun" src="./assets/vendor/lucide/icons/sun.svg" alt="" aria-hidden="true"><img class="ui-icon theme__icon theme__icon--moon" src="./assets/vendor/lucide/icons/moon.svg" alt="" aria-hidden="true"></button>
        <button id="open__nav-btn" type="button" aria-label="Menüyü aç"><img class="ui-icon" src="./assets/vendor/lucide/icons/menu.svg" alt="" aria-hidden="true"></button>
        <button id="close__nav-btn" type="button" aria-label="Menüyü kapat" hidden><img class="ui-icon" src="./assets/vendor/lucide/icons/x.svg" alt="" aria-hidden="true"></button>
    </div>
</nav>
<section class="form__section">
    <div class="container form__section-container">
        <h2>Hesap oluştur</h2>
        <div class="alert__message error" id="auth-message" hidden></div>
        <form id="signup-form">
            <input type="text" name="firstname" maxlength="80" autocomplete="given-name" placeholder="Ad" required>
            <input type="text" name="lastname" maxlength="80" autocomplete="family-name" placeholder="Soyad" required>
            <input type="email" name="email" maxlength="254" autocomplete="email" placeholder="E-posta" required>
            <input type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Şifre" required>
            <div class="form__control">
                <label for="avatar">Profil fotoğrafı <small>(isteğe bağlı)</small></label>
                <input type="file" name="avatar" id="avatar" accept="image/png,image/jpeg,image/webp">
            </div>
            <button type="submit" class="btn">Kayıt ol</button>
            <small>Zaten hesabınız var mı? <a href="./signin.html">Giriş yapın</a></small>
        </form>
    </div>
</section>
<script src="./assets/vendor/dompurify/purify.min.js"></script>
<script src="./assets/js/security.js?v=16"></script>
<script src="./assets/vendor/supabase/supabase.js"></script>
<script src="./assets/js/supabase-config.js?v=8"></script>
<script src="./assets/js/auth-storage.js?v=1"></script>
<script src="./assets/js/auth.js?v=14"></script>
<script src="./assets/js/auth-pages.js?v=15"></script>
<script src="./assets/js/main.js?v=17"></script>
</body>
</html>
