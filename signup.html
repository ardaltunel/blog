<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signup | Arda Altunel</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
    <link rel="stylesheet" href="//unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<nav>
    <div class="container nav__container">
        <a href="./index.html" class="nav__logo">ARDALTUNEL</a>
        <ul class="nav__items"></ul>
        <button class="theme__toggle" type="button" aria-label="Tema degistir"><i class="uil uil-moon"></i></button>
        <button id="open__nav-btn"><i class="uil uil-bars"></i></button>
        <button id="close__nav-btn"><i class="uil uil-multiply"></i></button>
    </div>
</nav>
<section class="form__section">
    <div class="container form__section-container">
        <h2>Signup</h2>
        <div class="alert__message error" id="auth-message" hidden></div>
        <form id="signup-form">
            <input type="text" name="firstname" placeholder="Firstname" required>
            <input type="text" name="lastname" placeholder="Lastname" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <div class="form__control">
                <input type="file" name="avatar" id="avatar" accept="image/png,image/jpeg,image/jpg">
            </div>
            <button type="submit" class="btn">Signup</button>
            <small>Already have an account? <a href="./signin.html">Signin</a></small>
        </form>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./js/supabase-config.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/auth-pages.js?v=4"></script>
<script src="./js/main.js"></script>
</body>
</html>
