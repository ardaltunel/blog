<section class="form__section">
    <div class="container form__section-container">
        <h2>Hesap oluştur</h2>
        <div class="alert__message error" id="auth-message" hidden></div>
        <form class="auth__form" id="signup-form">
            <button class="oauth__button" type="button" data-google-oauth>
                <img src="./assets/vendor/google/google-g.svg" alt="" aria-hidden="true">
                <span class="oauth__button-label">Google ile kayıt ol</span>
            </button>
            <div class="auth__divider" aria-hidden="true"><span>veya</span></div>
            <input type="text" name="firstname" maxlength="80" autocomplete="given-name" placeholder="Ad" required>
            <input type="text" name="lastname" maxlength="80" autocomplete="family-name" placeholder="Soyad" required>
            <input type="email" name="email" maxlength="254" autocomplete="email" placeholder="E-posta" required>
            <div class="password__field">
                <input id="signup-password" type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Şifre" required>
                <button class="password__toggle" type="button" aria-controls="signup-password" aria-pressed="false">Göster</button>
            </div>
            <div class="password__field">
                <input id="signup-password-confirmation" type="password" name="password_confirmation" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Şifreyi doğrula" required>
                <button class="password__toggle" type="button" aria-controls="signup-password-confirmation" aria-pressed="false">Göster</button>
            </div>
            <div class="form__control">
                <label class="form__label--single-line" for="avatar">Profil fotoğrafı <small>(isteğe bağlı)</small></label>
                <input type="file" name="avatar" id="avatar" accept="image/png,image/jpeg,image/webp">
            </div>
            <button type="submit" class="btn auth__submit">Kayıt ol</button>
            <p class="auth__switch">Zaten hesabınız var mı? <a href="./signin.html">Giriş yapın</a></p>
        </form>
    </div>
</section>
<script src="./assets/vendor/dompurify/purify.min.js"></script>
