<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard | Arda Altunel</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" href="./assets/favicon/favicon.ico">
    <link rel="stylesheet" href="//unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<nav>
    <div class="container nav__container">
        <a href="./index.html" class="nav__logo">ARDALTUNEL</a>
        <ul class="nav__items"></ul>
        <button class="theme__toggle" type="button" aria-label="Tema degistir"><i class="uil uil-moon"></i></button>
        <button id="open__nav-btn"><i class="uil uil-bars"></i></button>
        <button id="close__nav-btn"><i class="uil uil-multiply"></i></button>
    </div>
</nav>
<section class="dashboard">
    <div class="container dashboard__container">
        <aside>
            <a href="./add-post.html"><i class="uil uil-pen"></i><h5>Add Post</h5></a>
            <a href="./admin.html?view=my-posts" data-view-link="my-posts"><i class="uil uil-postcard"></i><h5>My Posts</h5></a>
            <a href="./admin.html?view=all-posts" data-admin-only data-view-link="all-posts"><i class="uil uil-list-ul"></i><h5>All Posts</h5></a>
            <a href="./admin.html?view=add-user" data-admin-only data-view-link="add-user"><i class="uil uil-user-plus"></i><h5>Add User</h5></a>
            <a href="./admin.html?view=manage-users" data-admin-only data-view-link="manage-users"><i class="uil uil-users-alt"></i><h5>Manage Users</h5></a>
            <a href="./admin.html?view=add-category" data-admin-only data-view-link="add-category"><i class="uil uil-edit"></i><h5>Add Category</h5></a>
            <a href="./admin.html?view=manage-categories" data-admin-only data-view-link="manage-categories"><i class="uil uil-file-alt"></i><h5>Manage Categories</h5></a>
        </aside>
        <main>
            <h2 id="dashboard-title">Dashboard</h2>
            <div class="alert__message error" id="auth-message" hidden></div>
            <div id="dashboard-content"></div>
        </main>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@database/supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./assets/js/supabase-config.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/auth-pages.js?v=4"></script>
<script src="./assets/js/main.js"></script>
</body>
</html>
