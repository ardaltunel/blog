name: Deploy SEO Pages

on:
  push:
    branches: [main]
  schedule:
    # Keep newly approved Supabase content close to the static Pages snapshot.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_deploy: ${{ steps.deployment-decision.outputs.should_deploy }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # A scheduled run only refreshes content from Supabase. The same commit was
      # already fully checked when it was pushed, so repeating lint, unit tests and
      # npm audit here turns one code/dependency failure into repeated emails.
      - name: Build and verify scheduled SEO refresh
        id: scheduled-build
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SEO_REQUIRE_REMOTE: "1"
          SITE_URL: "https://ardaltunel.github.io/blog/"
        run: npm run check:seo-deploy

      - name: Build and run full verification
        if: github.event_name != 'schedule'
        env:
          SEO_REQUIRE_REMOTE: "1"
          SITE_URL: "https://ardaltunel.github.io/blog/"
        run: npm run check

      - name: Check whether generated content changed
        id: deployment-decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          SCHEDULED_BUILD_OUTCOME: ${{ steps.scheduled-build.outcome }}
          SITE_URL: "https://ardaltunel.github.io/blog/"
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULED_BUILD_OUTCOME" != "success" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Scheduled Supabase refresh failed; keeping the last verified deployment."
          elif [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 20 \
            "${SITE_URL}assets/data/blog-data.js?content-check=${RUN_ID}" \
            --output remote-blog-data.js \
            && cmp --silent dist/assets/data/blog-data.js remote-blog-data.js; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Supabase content is unchanged; skipping the Pages deployment."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GitHub Pages artifact
        if: steps.deployment-decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
