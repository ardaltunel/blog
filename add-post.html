<!DOCTYPE html>
<html lang="tr">
<head>
    <title>Yeni Yazı | Arda Altunel</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://bdadbqlkmdwzzkrwetrf.supabase.co; font-src 'self'; connect-src 'self' https://bdadbqlkmdwzzkrwetrf.supabase.co; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <script src="./assets/js/theme-bootstrap.js?v=8"></script>
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" href="./assets/favicon/favicon.ico">
    <link rel="stylesheet" href="./assets/vendor/montserrat/montserrat.css">
    <link rel="stylesheet" href="./assets/css/style.css?v=26">
</head>
<body data-route="addPost">
<nav>
    <div class="container nav__container">
        <a href="./" class="nav__logo">ARDALTUNEL</a>
        <ul class="nav__items"></ul>
        <button class="theme__toggle" type="button" aria-label="Temayı değiştir"><img class="ui-icon" src="./assets/vendor/lucide/icons/moon.svg" alt="" aria-hidden="true"></button>
        <button id="open__nav-btn" type="button" aria-label="Menüyü aç"><img class="ui-icon" src="./assets/vendor/lucide/icons/menu.svg" alt="" aria-hidden="true"></button>
        <button id="close__nav-btn" type="button" aria-label="Menüyü kapat" hidden><img class="ui-icon" src="./assets/vendor/lucide/icons/x.svg" alt="" aria-hidden="true"></button>
    </div>
</nav>
<section class="form__section">
    <div class="container form__section-container authoring__container">
        <header class="authoring__header">
            <span class="authoring__kicker">İÇERİK STÜDYOSU</span>
            <h1>Yeni blog yazısı</h1>
            <p>Başlıkları, listeleri, bağlantıları ve videoları kullanarak okunması keyifli bir içerik hazırlayın.</p>
        </header>
        <div class="alert__message error" id="auth-message" hidden></div>
        <form id="add-post-form">
            <div class="form__control">
                <label for="post-title">Yazı başlığı</label>
                <input type="text" name="title" id="post-title" maxlength="160" placeholder="Okuyucuya ne öğreneceğini anlatan net bir başlık" required>
                <small>En iyi sonuç için kısa, açıklayıcı ve özgün bir başlık kullanın.</small>
            </div>
            <div class="form__control">
                <label for="category-select">Kategori</label>
                <select name="category" id="category-select" required></select>
            </div>
            <div class="form__control">
                <label for="editor">Yazı içeriği</label>
                <textarea name="body" maxlength="200000" placeholder="Yazı içeriği" id="editor" required></textarea>
            </div>
            <div class="form__control">
                <label for="thumbnail">Kapak görseli</label>
                <input type="file" name="thumbnail" id="thumbnail" accept="image/png,image/jpeg,image/webp" required>
                <small>16:9 oranında, en fazla 5 MB PNG, JPEG veya WebP önerilir.</small>
            </div>
            <button type="submit" class="btn authoring__submit">İncelemeye gönder</button>
        </form>
    </div>
</section>
<script src="./assets/vendor/dompurify/purify.min.js"></script>
<script src="./assets/js/security.js?v=16"></script>
<script src="./assets/vendor/supabase/supabase.js"></script>
<script src="./assets/js/supabase-config.js?v=8"></script>
<script src="./assets/js/auth-storage.js?v=1"></script>
<script src="./assets/js/auth.js?v=13"></script>
<script src="./assets/js/rich-editor.js?v=11"></script>
<script src="./assets/js/auth-pages.js?v=15"></script>
<script src="./assets/js/main.js?v=16"></script>
</body>
</html>
