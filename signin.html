<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signin | Arda Altunel</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
    <link rel="stylesheet" href="//unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<nav>
    <div class="container nav__container">
        <a href="./index.html" class="nav__logo">ARDALTUNEL</a>
        <ul class="nav__items"></ul>
        <button class="theme__toggle" type="button" aria-label="Tema degistir"><i class="uil uil-moon"></i></button>
        <button id="open__nav-btn"><i class="uil uil-bars"></i></button>
        <button id="close__nav-btn"><i class="uil uil-multiply"></i></button>
    </div>
</nav>
<section class="form__section">
    <div class="container form__section-container">
        <h2>Signin</h2>
        <div class="alert__message error" id="auth-message" hidden></div>
        <form id="signin-form">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Signin</button>
            <small>Don't have an account? <a href="./signup.html">Signup</a></small>
        </form>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@database/supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./assets/js/supabase-config.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/auth-pages.js?v=4"></script>
<script src="./assets/js/main.js"></script>
</body>
</html>
