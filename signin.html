<!DOCTYPE html>
<html lang="tr">
<head>
    <title>Giriş Yap | Arda Altunel</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://bdadbqlkmdwzzkrwetrf.supabase.co https://lh3.googleusercontent.com; font-src 'self'; connect-src 'self' https://bdadbqlkmdwzzkrwetrf.supabase.co; media-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <script src="./assets/js/theme-bootstrap.js?v=66"></script>
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" href="./assets/favicon/favicon.ico">
    <link rel="stylesheet" href="./assets/vendor/montserrat/montserrat.css">
<link rel="stylesheet" href="./assets/css/style.css?v=66">
</head>
<body>
<nav>
    <div class="container nav__container">
        <a href="./" class="nav__logo">ARDALTUNEL</a>
        <ul class="nav__items"></ul>
        <button class="theme__toggle" type="button" aria-label="Temayı değiştir"><img class="ui-icon theme__icon theme__icon--sun" src="./assets/vendor/lucide/icons/sun.svg" alt="" aria-hidden="true"><img class="ui-icon theme__icon theme__icon--moon" src="./assets/vendor/lucide/icons/moon.svg" alt="" aria-hidden="true"></button>
        <button id="open__nav-btn" type="button" aria-label="Menüyü aç"><img class="ui-icon" src="./assets/vendor/lucide/icons/menu.svg" alt="" aria-hidden="true"></button>
        <button id="close__nav-btn" type="button" aria-label="Menüyü kapat" hidden><img class="ui-icon" src="./assets/vendor/lucide/icons/x.svg" alt="" aria-hidden="true"></button>
    </div>
</nav>
<section class="form__section">
    <div class="container form__section-container">
        <h2>Giriş yap</h2>
        <div class="alert__message error" id="auth-message" hidden></div>
        <form class="auth__form" id="signin-form">
            <button class="oauth__button" type="button" data-google-oauth>
                <img src="./assets/vendor/google/google-g.svg" alt="" aria-hidden="true">
                <span class="oauth__button-label">Google ile giriş yap</span>
            </button>
            <div class="auth__divider" aria-hidden="true"><span>veya</span></div>
            <input type="email" name="email" maxlength="254" autocomplete="email" placeholder="E-posta" required>
            <div class="password__field">
                <input id="signin-password" type="password" name="password" minlength="8" maxlength="128" autocomplete="current-password" placeholder="Şifre" required>
                <button class="password__toggle" type="button" aria-controls="signin-password" aria-pressed="false">Göster</button>
            </div>
            <div class="signin__remember">
                <input type="checkbox" name="remember" value="1" id="remember-me">
                <label for="remember-me">
                    <span>Beni hatırla</span>
                    <small>Bu cihazda oturumum açık kalsın</small>
                </label>
            </div>
            <button type="submit" class="btn auth__submit">Giriş yap</button>
            <p class="auth__switch">Hesabınız yok mu? <a href="./signup.html">Hesap oluşturun</a></p>
        </form>
    </div>
</section>
<script src="./assets/vendor/dompurify/purify.min.js"></script>
<script src="./assets/js/security.js?v=66"></script>
<script src="./assets/vendor/supabase/supabase.js"></script>
<script src="./assets/js/supabase-config.js?v=66"></script>
<script src="./assets/js/auth-storage.js?v=66"></script>
<script src="./assets/js/auth.js?v=66"></script>
<script src="./assets/js/auth-pages.js?v=66"></script>
<script src="./assets/js/main.js?v=66"></script>
</body>
</html>
